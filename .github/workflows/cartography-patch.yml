name: Cartography Patch

on:
  push:
    branches:
      - feat/cartography-foundation-v2
    paths:
      - '.github/workflows/cartography-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cartography foundation improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Use vector province fills at city/detailed zoom. GPU remains the
          # overview renderer, while SVG geometry becomes the close-up authority.
          replace_once(
              "src/map/components/WorldMap.jsx",
              '  const base = useMemo(\n    () => <PhysicalGeographyLayer phase="base" zoom={cameraState.zoom} />,\n    [cameraState.zoom],\n  );',
              '  const base = <PhysicalGeographyLayer phase="base" zoom={cameraState.zoom} />;'
          )
          replace_once(
              "src/map/components/WorldMap.jsx",
              '        renderFill={!textureReady}',
              '        renderFill={!textureReady || cameraState.zoom >= 3.35}',
          )

          # 2) Remove double label scaling. CityLabelLayout already computes a
          # screen-stable font size; applying a second scale made labels collapse
          # to sub-pixel text in deep zooms.
          replace_once(
              "src/map/components/layers/CityLayer.jsx",
              '''function getLabelScale(zoom) {\n  if (zoom >= 6) return 0.42;\n  if (zoom >= 4) return 0.52;\n  if (zoom >= 3.35) return 0.62;\n  if (zoom >= 2.55) return 0.74;\n  return 1;\n}\n\n''',
              ''
          )
          replace_once(
              "src/map/components/layers/CityLayer.jsx",
              '        fontSize={fontSize * getLabelScale(zoom)}',
              '        fontSize={fontSize}',
          )

          # 3) Make city typography genuinely screen-stable across the LODs.
          replace_once(
              "src/map/rendering/city/CityLabelLayout.js",
              '''  return Math.max(0.035, Math.min(1.0, 0.95 * zoom ** -0.65));''',
              '''  return Math.max(0.22, Math.min(0.55, 1.8 / Math.sqrt(Math.max(1, zoom))));'''
          )

          # 4) Keep primary sea labels available in close views. The layout engine
          # still collision-checks them and only places them when they fit.
          physical = Path("src/map/data/AnatoliaPhysicalAtlas.js").read_text()
          physical = physical.replace('maxZoom:3.2, priority:100', 'maxZoom:12, priority:100')
          physical = physical.replace('maxZoom:4, priority:100', 'maxZoom:12, priority:100')
          physical = physical.replace('maxZoom:3.4, priority:100', 'maxZoom:12, priority:100')
          physical = physical.replace('maxZoom:3.2, priority:95', 'maxZoom:12, priority:95')
          Path("src/map/data/AnatoliaPhysicalAtlas.js").write_text(physical)

          # 5) Add deterministic regression coverage for the cartography foundation.
          test_path = Path("tools/tests/cartography-foundation.test.js")
          test_path.write_text(r'''import assert from "node:assert/strict";
import { ANATOLIA_CITY_ATLAS } from "../../src/map/data/AnatoliaCityAtlas.js";
import { ANATOLIA_PHYSICAL_ATLAS } from "../../src/map/data/AnatoliaPhysicalAtlas.js";
import { getMapLod } from "../../src/map/rendering/CartographyModel.js";
import {
  boxesOverlap,
  getCityVisualStyle,
  layoutCityLabels,
  selectVisibleCities,
} from "../../src/map/rendering/city/CityLabelLayout.js";

const cities = Object.entries(ANATOLIA_CITY_ATLAS).map(([id, map]) => ({ id, map }));

assert.equal(getMapLod(1), "world");
assert.equal(getMapLod(2.8), "city");
assert.equal(getMapLod(8), "detailed");

for (const zoom of [1.2, 2.8, 3.6, 5, 8]) {
  const visible = selectVisibleCities(cities, zoom);
  const labels = layoutCityLabels(visible, zoom);
  assert.ok(labels.length > 0, `Expected city labels at zoom ${zoom}`);
  assert.ok(labels.length <= 32, `Label budget exceeded at zoom ${zoom}`);

  const placedBoxes = [];
  for (const label of labels) {
    const style = getCityVisualStyle(label.city, zoom);
    assert.ok(style.fontSize >= 0.045, `City label became sub-pixel at zoom ${zoom}`);
    const width = Math.max(0.34, String(label.city.map.name).length * style.fontSize * 0.44);
    const half = width / 2;
    const box = {
      left: label.anchor === "start" ? label.x : label.anchor === "end" ? label.x - width : label.x - half,
      right: label.anchor === "start" ? label.x + width : label.anchor === "end" ? label.x : label.x + half,
      top: label.y - style.fontSize * 0.76,
      bottom: label.y + style.fontSize * 0.22,
    };
    for (const other of placedBoxes) {
      assert.equal(boxesOverlap(box, other), false, `City labels overlap at zoom ${zoom}`);
    }
    placedBoxes.push(box);
  }
}

assert.ok(getCityVisualStyle(cities[0], 8).fontSize > 0.1, "Deep-zoom city typography must remain readable.");
assert.ok(ANATOLIA_PHYSICAL_ATLAS.lakes.length >= 8);
assert.ok(ANATOLIA_PHYSICAL_ATLAS.rivers.length >= 10);
assert.ok(ANATOLIA_PHYSICAL_ATLAS.labels.filter((label) => label.kind === "sea").every((label) => label.maxZoom >= 8));

const requiredCities = ["konstantinopolis", "bursa", "nikaia", "ankara", "konya", "kayseri", "sivas", "trabzon", "erzurum"];
for (const id of requiredCities) {
  assert.ok(ANATOLIA_CITY_ATLAS[id], `Missing historical city atlas entry: ${id}`);
}

console.log(`Cartography foundation tests passed: ${cities.length} cities, ${ANATOLIA_PHYSICAL_ATLAS.rivers.length} rivers, ${ANATOLIA_PHYSICAL_ATLAS.lakes.length} lakes, deterministic labels across 5 zoom levels.`);
''')

          # 6) Expose the new regression test through npm and CI.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["scripts"]["test:cartography-foundation"] = "node tools/tests/cartography-foundation.test.js"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text()
          needle = "npm run test:cartography-2efgh"
          addition = "npm run test:cartography-foundation"
          if addition not in ci:
              if needle not in ci:
                  raise SystemExit("CI insertion point not found")
              ci = ci.replace(needle, needle + "\n          " + addition, 1)
          ci_path.write_text(ci)
          PY
      - name: Validate the patch
        run: |
          npm ci
          npm run lint
          npm run test:cartography-foundation
          npm run test:map-texture-atlas
          npm run test:cartography-2efgh
          npm run build
      - name: Commit cartography foundation improvements
        run: |
          set -euxo pipefail
          rm -f .github/workflows/cartography-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(cartography): establish professional multi-LOD map foundation'
          git push origin HEAD:feat/cartography-foundation-v2
