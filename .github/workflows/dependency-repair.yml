name: Dependency repair

on:
  push:
    branches:
      - feat/p3-map-performance

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair ESLint globals dependency') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install missing ESLint runtime dependency
        run: npm install --save-dev globals@^16.3.0
      - name: Validate lint
        run: npm run lint
      - name: Commit dependency repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dependency-repair.yml
          git add package.json package-lock.json
          git commit -m 'Repair ESLint globals dependency'
          git push
