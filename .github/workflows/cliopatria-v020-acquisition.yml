name: Cliopatria v0.2.0 acquisition verification

on:
  pull_request:
    branches:
      - integration/**
    paths:
      - ".github/workflows/cliopatria-v020-acquisition.yml"
      - "data/gis/1326/acquisition-manifest.json"
      - "tools/historical-gis/cli/acquire-1326-cliopatria.js"
      - "tools/historical-gis/cli/prepare-1326-cliopatria-extraction-input.js"
      - "tools/historical-gis/cli/validate-1326-cliopatria-extraction-input.js"
      - "tools/tests/1326-cliopatria-extraction-input.test.js"
      - "tools/historical-gis/cli/extract-1326-cliopatria-candidates.js"
      - "tools/historical-gis/cli/validate-1326-cliopatria-candidates.js"
      - "tools/tests/1326-cliopatria-candidate-validator.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Zenodo v0.2.0 archive
        run: |
          curl --fail --location --retry 3 --retry-all-errors             "https://zenodo.org/records/20274630/files/Seshat-Global-History-Databank/cliopatria-v0.2.0.zip?download=1"             --output /tmp/cliopatria-v0.2.0.zip

      - name: Verify Zenodo archive MD5
        run: |
          test "$(stat -c '%s' /tmp/cliopatria-v0.2.0.zip)" -eq 297058350
          test "$(md5sum /tmp/cliopatria-v0.2.0.zip | cut -d ' ' -f1)" = "6d573d5a07dfcd5a2c6c9933d6401d48"

      - name: Locate and verify pinned GeoJSON ZIP blob
        run: |
          rm -rf /tmp/cliopatria-v020
          mkdir -p /tmp/cliopatria-v020
          unzip -q /tmp/cliopatria-v0.2.0.zip -d /tmp/cliopatria-v020

          mapfile -t members < <(find /tmp/cliopatria-v020 -type f -name 'cliopatria.geojson.zip' -print)
          test "${#members[@]}" -eq 1
          source_zip="${members[0]}"

          actual_size="$(stat -c '%s' "$source_zip")"
          actual_blob="$(git hash-object "$source_zip")"

          echo "source_zip=$source_zip"
          echo "source_size=$actual_size"
          echo "source_git_blob=$actual_blob"

          test "$actual_blob" = "cefab0f4b622e2e7fb3daf68d4f461f83991204c"

      - name: Publish verified acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliopatria-v0.2.0-verified
          path: /tmp/cliopatria-v0.2.0.zip
          retention-days: 7
          compression-level: 0


      - name: Verify pinned GitHub raw acquisition path
        run: |
          node tools/historical-gis/cli/acquire-1326-cliopatria.js --download
          node tools/historical-gis/cli/acquire-1326-cliopatria.js --verify
          test "$(git hash-object data/build/gis/1326/source-snapshots/cliopatria-v0.2.0.geojson.zip)" = "cefab0f4b622e2e7fb3daf68d4f461f83991204c"

      - name: Publish directly acquired production snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cliopatria-v0.2.0-production-snapshot
          path: |
            data/build/gis/1326/source-snapshots/cliopatria-v0.2.0.geojson.zip
            data/build/gis/1326/source-snapshots/cliopatria-v0.2.0.acquisition.json
          retention-days: 7
          compression-level: 0


      - name: Prepare verified 1326 extraction input
        run: |
          npm run prepare:1326-cliopatria-extraction-input -- --archive data/build/gis/1326/source-snapshots/cliopatria-v0.2.0.geojson.zip
          npm run validate:1326-cliopatria-extraction-input -- --input data/build/gis/1326/cliopatria-extraction-input.json

      - name: Extract and validate real 1326 temporal candidates
        run: |
          npm run extract:1326-cliopatria -- --extraction-input data/build/gis/1326/cliopatria-extraction-input.json --output data/build/gis/1326/cliopatria-1326-candidates.json
          npm run validate:1326-cliopatria-candidates -- --input data/build/gis/1326/cliopatria-1326-candidates.json

      - name: Publish verified extraction input
        uses: actions/upload-artifact@v4
        with:
          name: cliopatria-v0.2.0-extraction-input
          path: |
            data/build/gis/1326/cliopatria-extraction-input.json
            data/build/gis/1326/source-snapshots/cliopatria-v0.2.0/**/cliopatria*.geojson
            data/build/gis/1326/cliopatria-1326-candidates.json
          retention-days: 7
          compression-level: 0

