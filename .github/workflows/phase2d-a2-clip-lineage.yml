name: Phase 2D A2 Clip Lineage

on:
  push:
    branches:
      - codex/phase2.8-c-a2-edge-trace-clip-lineage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clip-lineage:
    runs-on: ubuntu-latest
    env:
      CANONICAL_ROOT: /tmp/historia-ai-canonical
      A2_TARGET_AREA: 2.27e-13
      A2_TINY_EPSILON: 1e-10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required hydrography runtime fixture
        run: npm run build:assets
      - name: Record forensic execution identity
        run: |
          mkdir -p forensic-output
          {
            echo "branch=$${GITHUB_REF_NAME}"
            echo "head=$$(git rev-parse HEAD)"
            echo "targetArea=$${A2_TARGET_AREA}"
            echo "tinyEpsilon=$${A2_TINY_EPSILON}"
            echo "node=$$(node --version)"
            echo "git=$$(git --version)"
          } > forensic-output/execution-identity.txt
          cat forensic-output/execution-identity.txt
      - name: Fetch canonical production branch
        run: |
          git fetch --no-tags origin 6b7424125eee4a1c72925b7a1780c68e695e9ba3
          git worktree add --detach /tmp/historia-ai-canonical 6b7424125eee4a1c72925b7a1780c68e695e9ba3
      - name: Run historical clipCellToLand lineage
        id: clip_lineage
        run: |
          node tools/tests/phase2d-a2-clip-lineage-probe.mjs > forensic-output/a2-clip-lineage.json 2> forensic-output/a2-clip-lineage.stderr
          status=$$?
          cat forensic-output/a2-clip-lineage.json
          if [ -s forensic-output/a2-clip-lineage.stderr ]; then cat forensic-output/a2-clip-lineage.stderr; fi
          exit $$status
      - name: Upload clip lineage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-a2-clip-lineage
          path: |
            forensic-output/execution-identity.txt
            forensic-output/a2-clip-lineage.json
            forensic-output/a2-clip-lineage.stderr
          if-no-files-found: error
          retention-days: 7
