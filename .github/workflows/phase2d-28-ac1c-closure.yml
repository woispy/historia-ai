name: Phase 2D 2.8-C A1 A2 C Closure Audit

on:
  push:
    branches:
      - codex/phase2.8-b4-forensic-calibration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required hydrography runtime fixture
        run: npm run build:assets
      - name: Fetch canonical production
        run: |
          git fetch --no-tags origin 6b7424125eee4a1c72925b7a1780c68e695e9ba3
          git worktree add --detach /tmp/historia-ai-canonical 6b7424125eee4a1c72925b7a1780c68e695e9ba3
          mkdir -p /tmp/historia-ai-canonical/src/map/data/generated
          cp src/map/data/generated/anatolia-hydrography-10m.json /tmp/historia-ai-canonical/src/map/data/generated/anatolia-hydrography-10m.json
      - name: Run closure audit
        env:
          CANONICAL_ROOT: /tmp/historia-ai-canonical
        run: |
          mkdir -p forensic-output
          node tools/tests/phase2d-28-ac1c-closure-audit.mjs > forensic-output/closure.json
          cat forensic-output/closure.json
      - name: Upload closure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-28-ac1c-closure
          path: forensic-output/closure.json
          retention-days: 7
