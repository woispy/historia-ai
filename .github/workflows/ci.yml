name: Historia AI CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - feat/phase1-polish
      - feat/phase1-historical-gis-runtime
      - feat/phase1-map-camera-ui-polish
      - agent/anatolia-byzantium-regional-layer
      - feat/anatolia-historical-map-overhaul
      - feat/anatolia-physical-geography
      - feat/anatolia-map-label-water-overhaul
      - feat/world-1300-map-foundation
      - feat/phase2b-anatolia-reconstruction
      - feat/phase2c-anatolia-geometry-refinement
      - feat/phase2d-anatolia-province-geometry
      - feat/phase2efgh-cartography
      - feat/cartography-visual-refinement
      - feat/map-gpu-texture-architecture
      - feat/p1-historical-political-map-foundation
  push:
    branches:
      - main
      - master
      - feat/living-game-foundation
      - feat/phase1-polish
      - feat/phase1-historical-gis-runtime
      - feat/phase1-map-camera-ui-polish
      - feat/phase1-save-menu-camera-ux
      - fix/historical-gis-import-integrity
      - agent/anatolia-byzantium-regional-layer
      - feat/anatolia-historical-map-overhaul
      - feat/anatolia-physical-geography
      - feat/anatolia-map-label-water-overhaul
      - feat/world-1300-map-foundation
      - feat/anatolia-phase2-historical-gis
      - feat/phase2b-anatolia-reconstruction
      - feat/phase2c-anatolia-geometry-refinement
      - feat/phase2d-anatolia-province-geometry
      - feat/phase2efgh-cartography
      - feat/cartography-visual-refinement
      - feat/map-gpu-texture-architecture
      - feat/cartography-foundation-v2
      - feat/phase3-runtime-engine
      - feat/runtime-province-selection
      - feat/historical-map-clean-foundation
      - feat/historical-political-map-v1
      - feat/p1-historical-political-map-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Generate world physical geometry assets
        run: npm run build:assets
      - name: Verify repository cleanliness after physical assets
        run: npm run test:repository-cleanliness
      - name: Generate historical GIS runtime assets
        run: npm run build:historical-gis:1300
      - name: Verify repository cleanliness after historical GIS
        run: npm run test:repository-cleanliness
      - name: Validate historical GIS runtime assets
        run: npm run validate:historical-gis:1300
      - name: Run historical GIS identity tests
        run: npm run test:historical-gis
      - name: Run historical runtime regionalization tests
        run: npm run test:historical-runtime-regions
      - name: Run physical geography tests
        run: npm run test:physical-geography
      - name: Run Natural Earth 10m hydrography tests
        run: npm run test:hydrography-10m
      - name: Run hydrography LOD visibility tests
        run: npm run test:hydrography-visibility
      - name: Run world map land-mask tests
        run: npm run test:world-map
      - name: Run historical world anchor tests
        run: npm run test:historical-world
      - name: Run historical map contract tests
        run: npm run test:historical-map-contract
      - name: Run historical political runtime tests
        run: npm run test:historical-political-runtime
      - name: Run historical province political state tests
        run: npm run test:historical-province-political-state
      - name: Run historical political region coverage tests
        run: npm run test:historical-political-region-layer
      - name: Run historical political world coverage invariant tests
        run: npm run test:historical-political-coverage-invariants
      - name: Run historical political map v1 tests
        run: npm run test:historical-political-map-v1
      - name: Run historical Anatolia control tests
        run: npm run test:anatolia-historical-control
      - name: Run city label scale regression tests
        run: npm run test:city-label-scale
      - name: Run Phase 2 province topology tests
        run: npm run test:province-topology
      - name: Run Phase 2B Anatolia reconstruction tests
        run: npm run test:anatolia-phase2b
      - name: Run Phase 2C Anatolia refinement tests
        run: npm run test:anatolia-phase2c
      - name: Run Phase 2D Anatolia geometry tests
        run: npm run test:anatolia-phase2d
      - name: Run Phase 2E-2H cartography tests
        run: npm run test:cartography-2efgh
      - name: Run cartography foundation regression tests
        run: npm run test:cartography-foundation
      - name: Run map texture atlas regression tests
        run: npm run test:map-texture-atlas
      - name: Run cartography visual regression tests
        run: npm run test:cartography-visual
      - name: Run map rendering contract tests
        run: npm run test:map-rendering-contract
      - name: Run province selection contract tests
        run: npm run test:province-selection
      - name: Run new game state tests
        run: npm run test:new-game
      - name: Run new game startup tests
        run: npm run test:new-game-startup
      - name: Run game entry handoff tests
        run: npm run test:game-entry-handoff
      - name: Run browser game entry handoff tests
        run: npm run test:browser-game-entry-handoff
      - name: Run main menu entry integration tests
        run: npm run test:main-menu-entry
      - name: Run scenario loading contract tests
        run: npm run test:scenario-loading
      - name: Run ESM import contract tests
        run: npm run test:esm-import-contract
      - name: Run runtime engine tests
        run: npm run test:runtime-engine
      - name: Build
        run: npm run build
      - name: Verify repository cleanliness after production build
        run: npm run test:repository-cleanliness
      - name: Verify historical GIS and map scripts
        run: |
          git status --short
          git ls-files --others --exclude-standard
