name: Historia AI CI

on:
  pull_request:
    branches:
      - master
      - feat/phase1-polish
      - feat/phase1-historical-gis-runtime
      - feat/phase1-map-camera-ui-polish
      - agent/anatolia-byzantium-regional-layer
      - feat/anatolia-historical-map-overhaul
      - feat/anatolia-physical-geography
      - feat/anatolia-map-label-water-overhaul
      - feat/world-1300-map-foundation
  push:
    branches:
      - master
      - feat/living-game-foundation
      - feat/phase1-polish
      - feat/phase1-historical-gis-runtime
      - feat/phase1-map-camera-ui-polish
      - feat/phase1-save-menu-camera-ux
      - fix/historical-gis-import-integrity
      - agent/anatolia-byzantium-regional-layer
      - feat/anatolia-historical-map-overhaul
      - feat/anatolia-physical-geography
      - feat/anatolia-map-label-water-overhaul
      - feat/world-1300-map-foundation
      - feat/anatolia-phase2-historical-gis

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run historical GIS identity tests
        run: npm run test:historical-gis
      - name: Run physical geography tests
        run: npm run test:physical-geography
      - name: Run world map land-mask tests
        run: npm run test:world-map
      - name: Run historical world anchor tests
        run: npm run test:historical-world
      - name: Run Phase 2 province topology tests
        run: npm run test:province-topology
      - name: Generate historical GIS runtime assets
        run: npm run build:historical-gis:1300
      - name: Validate historical GIS runtime assets
        run: npm run validate:historical-gis:1300
      - name: Build
        run: npm run build
      - name: Verify historical GIS and map scripts
        run: >-
          node --check tools/historical-gis/HistoricalAssetId.js &&
          node --check tools/historical-gis/HistoricalGeometryImporter.js &&
          node --check tools/historical-gis/HistoricalProvinceAssetBuilder.js &&
          node --check tools/historical-gis/cli/import-1300.js &&
          node --check tools/historical-gis/cli/test-1300.js &&
          node --check tools/historical-gis/cli/validate-1300.js &&
          node --check tools/tests/physical-geography-1300.test.js &&
          node --check tools/tests/world-land-mask.test.js &&
          node --check tools/tests/historical-world-1300.test.js &&
          node --check tools/tests/province-topology.test.js &&
          node --check src/world/historical/HistoricalCountryResolver.js &&
          node --check src/world/historical/HistoricalWorld1300Registry.js &&
          node --check src/provinces/HistoricalProvinceRepository.js &&
          node --check src/provinces/ProvinceFactory.js &&
          node --check src/provinces/ProvinceModel.js &&
          node --check src/map/rendering/province/ProvinceTopology.js &&
          node --check src/map/camera/CameraModel.js &&
          node --check src/map/camera/CameraActions.js
