name: Phase 2.8-C A2 Amisos Telemetry

on:
  pull_request:
    branches:
      - integration/phase-a-h-production
  workflow_dispatch:

jobs:
  a2-amisos-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate required GIS runtime assets
        run: npm run build:assets

      - name: Run isolated A2 Amisos edge telemetry
        run: node tools/tests/phase2d-a2-amisos-edge-telemetry.mjs

      - name: Upload A2 edge telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2.8-c-a2-amisos-edge-telemetry
          path: artifacts/phase2.8-c/a2-amisos-edge-telemetry.json
          if-no-files-found: error
