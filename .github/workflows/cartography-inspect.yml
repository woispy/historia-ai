name: Cartography Inspect

on:
  push:
    branches:
      - feat/cartography-foundation-v2
    paths:
      - '.github/workflows/cartography-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect map architecture
        run: |
          set -euxo pipefail
          echo '--- WorldMap.jsx ---'
          sed -n '1,260p' src/map/components/WorldMap.jsx
          echo '--- RenderRoot.jsx ---'
          sed -n '1,260p' src/map/rendering/RenderRoot.jsx
          echo '--- SvgRenderer.jsx ---'
          sed -n '1,260p' src/map/rendering/SvgRenderer.jsx
          echo '--- package.json ---'
          cat package.json
          echo '--- map tree ---'
          find src/map -maxdepth 4 -type f | sort
          echo '--- workflows ---'
          find .github/workflows -maxdepth 1 -type f -print | sort
      - name: Remove inspection workflow
        run: |
          set -euxo pipefail
          rm -f .github/workflows/cartography-inspect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(cartography): remove temporary architecture inspector' || exit 0
          git push origin HEAD:feat/cartography-foundation-v2
