name: Cartography Inspect

on:
  push:
    branches:
      - feat/cartography-foundation-v2
    paths:
      - '.github/workflows/cartography-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect render stacking and camera viewport
        run: |
          set -euxo pipefail
          for f in src/map/rendering/RenderRoot.css src/map/camera/CameraViewport.jsx src/map/rendering/gpu/ProvinceTextureLayer.jsx; do
            echo "===== $f ====="
            wc -l "$f"
            sed -n '1,760p' "$f"
          done
      - name: Remove inspection workflow
        run: |
          set -euxo pipefail
          rm -f .github/workflows/cartography-inspect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(cartography): remove temporary render inspector' || exit 0
          git push origin HEAD:feat/cartography-foundation-v2
