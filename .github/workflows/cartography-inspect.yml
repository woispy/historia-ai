name: Cartography Inspect

on:
  push:
    branches:
      - feat/cartography-foundation-v2
    paths:
      - '.github/workflows/cartography-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect map layers and data
        run: |
          set -euxo pipefail
          for f in \
            src/map/components/layers/index.js \
            src/map/components/layers/CartographyLayer.jsx \
            src/map/components/layers/PhysicalGeographyLayer.jsx \
            src/map/components/layers/CityLayer.jsx \
            src/map/components/layers/WorldPhysicalLayer.jsx \
            src/map/data/CartographyAtlas.js \
            src/map/data/AnatoliaPhysicalAtlas.js \
            src/map/data/AnatoliaCityAtlas.js \
            src/map/rendering/CartographyModel.js \
            src/map/rendering/physical/PhysicalLabelLayout.js \
            src/map/rendering/city/CityLabelLayout.js \
            src/map/physical/WorldPhysicalAtlas.js \
            src/map/physical/WorldLandMask.js \
            src/map/rendering/gpu/ProvinceTextureLayer.jsx \
            tools/tests/physical-geography-1300.test.js \
            tools/tests/map-texture-atlas.test.js
          do
            echo "===== $f ====="
            sed -n '1,420p' "$f"
          done
      - name: Remove inspection workflow
        run: |
          set -euxo pipefail
          rm -f .github/workflows/cartography-inspect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(cartography): remove temporary layer inspector' || exit 0
          git push origin HEAD:feat/cartography-foundation-v2
