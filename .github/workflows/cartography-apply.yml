name: Cartography Foundation Apply

on:
  push:
    branches:
      - feat/cartography-foundation-v2
    paths:
      - '.github/workflows/cartography-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes
        run: python tools/cartography/upgrade-foundation.py
      - name: Validate source changes
        run: |
          npm ci
          npm run lint
          npm run test:cartography-foundation
          npm run test:map-texture-atlas
          npm run test:cartography-2efgh
          npm run build
      - name: Commit validated source changes
        run: |
          set -euxo pipefail
          rm -f tools/cartography/upgrade-foundation.py .github/workflows/cartography-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(cartography): establish professional multi-LOD map foundation'
          git push origin HEAD:feat/cartography-foundation-v2
