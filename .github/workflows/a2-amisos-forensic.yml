name: A2 Amisos Forensic Trace

on:
  push:
    branches:
      - forensics/a2-amisos-pipeline-trace
  workflow_dispatch:

env:
  A2_FORENSIC_HARNESS: immutable-worktree-v4-producer-v3

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false
      - name: Generate physical assets
        run: npm run build:assets
      - name: Generate historical GIS runtime
        run: npm run build:historical-gis:1300
      - name: Trace Amisos runtime-to-GPU area lineage
        run: node tools/forensics/a2-amisos-pipeline-trace.mjs
      - name: Replay historical A2 checkpoints
        run: node tools/forensics/a2-amisos-checkpoint-replay.mjs
      - name: Replay historical A2 Stage A-B-C V3
        run: node tools/forensics/a2-amisos-stage-replay-v3.mjs
      - name: Upload forensic reports
        uses: actions/upload-artifact@v4
        with:
          name: a2-amisos-forensic-reports
          path: |
            a2-amisos-forensic-report.json
            a2-amisos-checkpoint-replay.json
            a2-amisos-stage-replay-v3.json
