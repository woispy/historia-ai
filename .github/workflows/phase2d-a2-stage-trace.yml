name: Phase 2D A2 Canonical Stage Trace

on:
  push:
    branches:
      - codex/phase2.8-c-a2-stage-trace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate hydrography runtime fixture
        run: npm run build:assets
      - name: Run canonical Amisos stage trace
        run: node tools/tests/phase2d-a2-stage-trace-v4.mjs | tee a2-stage-trace.json
      - name: Upload trace artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-a2-stage-trace
          path: a2-stage-trace.json
          retention-days: 7
      # Forensic-only trigger: no production behavior change.
