name: Phase 2D authority repair

on:
  push:
    branches:
      - feat/p3-map-performance

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair Phase 2D physical-land authority') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch physical-land authority ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/historical-gis/AnatoliaPhase2DGeometryBuilderV8.js')
          text = path.read_text()
          old = '''export function isPhysicalLandPoint(point) {
            if (!Array.isArray(point) || point.length !== 2) return false;
            if (inLake(point)) return false;
            if (isExplicitLandControlPoint(point) || isCorrectionShorelineVertex(point) || isAtlasLandBoundaryPoint(point)) return true;
            if (isExplicitExcludedWater(point)) return false;
            if (inCorrectionLandPatch(point)) return true;
            if (ANATOLIA_PHYSICAL_ATLAS.landPolygons.some((polygon) => pointInPolygon(point, polygon))) return true;
            let distance = Infinity;
            for (const polygon of ANATOLIA_PHYSICAL_ATLAS.landPolygons) {
              for (let i = 0; i < polygon.length; i += 1) {
                distance = Math.min(distance, distanceToSegment(point, polygon[i], polygon[(i + 1) % polygon.length]));
              }
            }
            return distance <= COAST_TOLERANCE;
          }'''
          new = '''export function isPhysicalLandPoint(point) {
            if (!Array.isArray(point) || point.length !== 2) return false;
            // Explicit water exclusions are authoritative. Curated terrestrial
            // corrections are the corresponding positive authority and must be
            // evaluated before generated lake topology: the generated 10m
            // hydrography can overrun a deliberately curated medieval shore.
            if (isExplicitExcludedWater(point)) return false;
            if (isExplicitLandControlPoint(point) || isCorrectionShorelineVertex(point)) return true;
            if (inCorrectionLandPatch(point)) return true;
            if (inLake(point)) return false;
            if (isAtlasLandBoundaryPoint(point)) return true;
            if (ANATOLIA_PHYSICAL_ATLAS.landPolygons.some((polygon) => pointInPolygon(point, polygon))) return true;
            let distance = Infinity;
            for (const polygon of ANATOLIA_PHYSICAL_ATLAS.landPolygons) {
              for (let i = 0; i < polygon.length; i += 1) {
                distance = Math.min(distance, distanceToSegment(point, polygon[i], polygon[(i + 1) % polygon.length]));
              }
            }
            return distance <= COAST_TOLERANCE;
          }'''
          if old not in text:
            raise SystemExit('Expected isPhysicalLandPoint block not found; refusing unsafe edit')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify targeted Phase 2D contracts
        run: |
          npm ci
          npm run test:anatolia-phase2d
          npm run test:anatolia-phase2d-physical-authority
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase2d-authority-repair.yml
          git add tools/historical-gis/AnatoliaPhase2DGeometryBuilderV8.js
          git commit -m 'Repair Phase 2D physical-land authority ordering'
          git push
