name: Phase 2D V15 Raw Forensics

on:
  push:
    branches:
      - codex/phase2.8-c-a2-edge-trace
      - codex/phase2.8-c-c1-amasya-edge3-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required hydrography runtime fixture
        run: npm run build:assets
      - name: Fetch canonical production branch
        run: git fetch --no-tags origin 6b7424125eee4a1c72925b7a1780c68e695e9ba3 && git worktree add --detach /tmp/historia-ai-canonical 6b7424125eee4a1c72925b7a1780c68e695e9ba3
      - name: Provision canonical generated hydrography fixture
        run: mkdir -p /tmp/historia-ai-canonical/src/map/data/generated && cp src/map/data/generated/anatolia-hydrography-10m.json /tmp/historia-ai-canonical/src/map/data/generated/anatolia-hydrography-10m.json
      - name: Run C1 Pontus-Amasya Edge 3 authority matrix
        id: c1_probe
        continue-on-error: true
        run: |
          mkdir -p forensic-output
          node tools/tests/phase2d-v15-c-c1-amasya-edge3-matrix.mjs > forensic-output/c1-amasya-edge3-matrix.json 2> forensic-output/c1-amasya-edge3-matrix.stderr
          status=$?
          if [ ! -s forensic-output/c1-amasya-edge3-matrix.json ]; then
            printf '{"probeStatus":"failed-before-summary","exitCode":%s,"stderr":' "$status" > forensic-output/c1-amasya-edge3-matrix.json
            python -c 'import json,sys; print(json.dumps(open(sys.argv[1]).read()), end="")' forensic-output/c1-amasya-edge3-matrix.stderr >> forensic-output/c1-amasya-edge3-matrix.json
            printf '}\n' >> forensic-output/c1-amasya-edge3-matrix.json
          fi
          cat forensic-output/c1-amasya-edge3-matrix.json
          if [ -s forensic-output/c1-amasya-edge3-matrix.stderr ]; then cat forensic-output/c1-amasya-edge3-matrix.stderr; fi
          exit $status
      - name: Upload C1 machine-readable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-v15-c-c1-amasya-edge3-matrix
          path: |
            forensic-output/c1-amasya-edge3-matrix.json
            forensic-output/c1-amasya-edge3-matrix.stderr
          if-no-files-found: warn
          retention-days: 7
