name: Phase 2D V15 Raw Forensics

on:
  push:
    branches:
      - codex/phase2.8-c-v15-raw-forensics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required hydrography runtime fixture
        run: npm run build:assets
      - name: Run V15 raw/serialized forensic probe
        id: raw_probe
        continue-on-error: true
        run: node tools/tests/phase2d-v15-raw-forensics.mjs
      - name: Run V15 authority comparison probe
        run: node tools/tests/phase2d-v15-authority-probe.mjs
      - name: Preserve expected forensic failure status
        if: steps.raw_probe.outcome == 'failure'
        run: echo 'Raw V15 forensic probe reproduced the expected native failure; authority probe completed independently.'
