name: Phase 2D V15 Raw Forensics

on:
  push:
    branches:
      - codex/phase2.8-c-v15-raw-forensics
      - codex/phase2.8-c-v15-site-pair-forensics-v2
      - codex/phase2.8-c-v15-site-pair-forensics-v3b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required hydrography runtime fixture
        run: npm run build:assets
      - name: Run V15 raw/serialized forensic probe
        id: raw_probe
        continue-on-error: true
        run: node tools/tests/phase2d-v15-raw-forensics.mjs
      - name: Run V15 authority comparison probe
        run: node tools/tests/phase2d-v15-authority-probe.mjs
      - name: Fetch canonical production branch
        run: git fetch --no-tags origin 6b7424125eee4a1c72925b7a1780c68e695e9ba3 && git worktree add --detach /tmp/historia-ai-canonical 6b7424125eee4a1c72925b7a1780c68e695e9ba3
      - name: Provision canonical generated hydrography fixture
        run: mkdir -p /tmp/historia-ai-canonical/src/map/data/generated && cp src/map/data/generated/anatolia-hydrography-10m.json /tmp/historia-ai-canonical/src/map/data/generated/anatolia-hydrography-10m.json
      - name: Run canonical geometry comparison probe
        env:
          CANONICAL_ROOT: /tmp/historia-ai-canonical
        run: node tools/tests/phase2d-v15-canonical-geometry-probe.mjs
      - name: Run B1 B2 B3 nine-edge divergence probe
        env:
          CANONICAL_ROOT: /tmp/historia-ai-canonical
        run: node tools/tests/phase2d-v15-b1-b2-b3-9edge-probe.mjs
      - name: Run site-pair provenance v2 probe
        if: github.ref == 'refs/heads/codex/phase2.8-c-v15-site-pair-forensics-v2'
        env:
          CANONICAL_ROOT: /tmp/historia-ai-canonical
        run: node tools/tests/phase2d-v15-site-pair-forensics-v2.mjs > forensic-output/site-pair-forensics-v2.json
      - name: Upload site-pair provenance v2 artifact
        if: github.ref == 'refs/heads/codex/phase2.8-c-v15-site-pair-forensics-v2'
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-v15-site-pair-forensics-v2
          path: forensic-output/site-pair-forensics-v2.json
      - name: Run direct canonical site-pair provenance v3 probe
        if: github.ref == 'refs/heads/codex/phase2.8-c-v15-site-pair-forensics-v3b'
        id: v3_probe
        continue-on-error: true
        env:
          CANONICAL_ROOT: /tmp/historia-ai-canonical
        run: |
          mkdir -p forensic-output
          set +e
          node tools/tests/phase2d-v15-site-pair-forensics-v3.mjs > forensic-output/site-pair-forensics-v3.stdout.json 2> forensic-output/site-pair-forensics-v3.stderr.log
          status=$?
          printf '%s\n' "$status" > forensic-output/site-pair-forensics-v3.exit-code
          exit "$status"
      - name: Upload direct canonical site-pair provenance v3 artifact
        if: always() && github.ref == 'refs/heads/codex/phase2.8-c-v15-site-pair-forensics-v3b'
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-v15-site-pair-forensics-v3
          path: forensic-output/
          if-no-files-found: warn
      - name: Run V15 site-pair matrix v4 probe
        if: github.ref == 'refs/heads/codex/phase2.8-c-v15-site-pair-forensics-v3b'
        id: v4_probe
        continue-on-error: true
        env:
          CANONICAL_ROOT: /tmp/historia-ai-canonical
        run: |
          mkdir -p forensic-output
          set +e
          node tools/tests/phase2d-v15-site-pair-forensics-v4.mjs > forensic-output/site-pair-forensics-v4.stdout.json 2> forensic-output/site-pair-forensics-v4.stderr.log
          status=$?
          printf '%s\n' "$status" > forensic-output/site-pair-forensics-v4.exit-code
          exit "$status"
      - name: Upload V15 site-pair matrix v4 artifact
        if: always() && github.ref == 'refs/heads/codex/phase2.8-c-v15-site-pair-forensics-v3b'
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-v15-site-pair-forensics-v4
          path: forensic-output/site-pair-forensics-v4.*
          if-no-files-found: warn
      - name: Preserve expected forensic failure status
        if: steps.raw_probe.outcome == 'failure'
        run: echo 'Raw V15 forensic probe reproduced the expected native failure; comparison probes completed independently.'
