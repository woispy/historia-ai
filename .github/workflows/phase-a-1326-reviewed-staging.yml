name: Phase A — 1326 Reviewed Evidence Staging

on:
  push:
    branches:
      - codex/phase-a-1326-reviewed-staging
  workflow_dispatch:

jobs:
  reviewed-staging:
    name: 1326 Reviewed Evidence Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Runner smoke
        run: |
          set -euo pipefail
          echo "reviewed-staging-job=started"
          node --version
          test -f package.json

      - name: Acquire Cliopatria
        run: npm run acquire:1326-cliopatria

      - name: Verify retained bytes
        run: npm run verify:1326-cliopatria

      - name: Extract archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/build/gis/1326/source-snapshots/cliopatria-v0.2.0-extracted
          unzip -q data/build/gis/1326/source-snapshots/cliopatria-v0.2.0.geojson.zip -d data/build/gis/1326/source-snapshots/cliopatria-v0.2.0-extracted

      - name: Inventory extracted files
        shell: bash
        run: |
          set -euo pipefail
          find data/build/gis/1326/source-snapshots/cliopatria-v0.2.0-extracted -type f -printf '%p %s bytes\\n' | sort

      - name: Select and validate GeoJSON FeatureCollection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find data/build/gis/1326/source-snapshots/cliopatria-v0.2.0-extracted -type f \\( -name '*.geojson' -o -name '*.json' \\) -print | sort)
          test "${#candidates[@]}" -gt 0
          selected=""
          for candidate in "${candidates[@]}"; do
            if node - "$candidate" <<'NODE'
const fs = require("node:fs");
const input = process.argv[2];
try {
  const data = JSON.parse(fs.readFileSync(input, "utf8"));
  if (data?.type === "FeatureCollection" && Array.isArray(data.features)) {
    console.log(JSON.stringify({ input, featureCount: data.features.length }));
    process.exit(0);
  }
} catch {}
process.exit(1);
NODE
            then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          echo "input=$selected" >> "$GITHUB_OUTPUT"

      - name: Extract 1326 candidates
        run: npm run extract:1326-cliopatria -- --input "${{ steps.source.outputs.input }}"
