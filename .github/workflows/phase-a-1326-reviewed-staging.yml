name: Phase A — 1326 Reviewed Evidence Staging

on:
  push:
    branches:
      - codex/phase-a-1326-reviewed-staging
  workflow_dispatch:

jobs:
  reviewed-staging:
    name: 1326 Reviewed Evidence Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Runner smoke
        run: |
          set -euo pipefail
          echo "reviewed-staging-job=started"
          node --version
          test -f package.json

      - name: Acquire Cliopatria
        run: npm run acquire:1326-cliopatria

      - name: Verify retained bytes
        run: npm run verify:1326-cliopatria
